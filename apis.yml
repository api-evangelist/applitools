- aid: applitools:execution-cloud
  name: Applitools Execution Cloud
  description: >-
    Cloud test execution infrastructure with self-healing capabilities - tests remain functional even
    when UI elements change. Drop-in remote WebDriver replacement for Selenium, Playwright, and WebdriverIO
    tests.
