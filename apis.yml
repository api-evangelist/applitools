    url: https://applitools.com/docs/eyes/reference/server-api
  - type: ProductDocs
    url: https://applitools.com/docs/
- aid: applitools:eyes-sdks
  name: Applitools Eyes SDKs
  description: >-
    Visual testing SDKs that integrate with existing test frameworks (Selenium, Cypress, Playwright, WebdriverIO,
    Puppeteer, Appium, Espresso, XCUI, Robot Framework, Images) across JavaScript/TypeScript, Java, Python,
    C#, and Ruby. SDKs send screenshots and DOM snapshots to the Eyes cloud server for Visual AI comparison.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
