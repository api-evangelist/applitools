aid: applitools
url: https://raw.githubusercontent.com/api-evangelist/applitools/refs/heads/main/apis.yml
name: Applitools
kind: company
description: >-
  Applitools is a Visual AI testing platform for end-to-end functional, visual,
  and API testing. The product line covers Eyes (Visual AI inside existing test
  frameworks), Autonomous (no-code AI-powered E2E platform), Execution Cloud
  (self-healing cloud test runner), and Ultrafast Grid (cross-browser/device
  visual rendering). Applitools exposes a REST server API at eyesapi.applitools.com
  and ships SDKs for Selenium, Cypress, Playwright, WebdriverIO, Puppeteer,
  Appium, Espresso, XCUI, Robot Framework, and more across JavaScript,
  TypeScript, Java, Python, C#, and Ruby.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
