apis:
- aid: applitools:eyes-server-api
  name: Applitools Eyes Server REST API
  description: >-
    REST API for the Applitools Eyes cloud server. Endpoint groups include Batch Management (results,
    statistics, properties, deletion), Discussions (list and manage comments), and SCM Integrations (status
    setting for source control systems). Authentication uses the user's Applitools API key.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://applitools.com/docs/eyes/reference/server-api
  baseURL: https://eyesapi.applitools.com
  tags:
  - REST
  - Eyes
  - Batches
  - Discussions
  - SCM
  properties:
  - type: Documentation
    url: https://applitools.com/docs/eyes/reference/server-api
  - type: ProductDocs
    url: https://applitools.com/docs/
- aid: applitools:eyes-sdks
  name: Applitools Eyes SDKs
  description: >-
    Visual testing SDKs that integrate with existing test frameworks (Selenium, Cypress, Playwright, WebdriverIO,
    Puppeteer, Appium, Espresso, XCUI, Robot Framework, Images) across JavaScript/TypeScript, Java, Python,
    C#, and Ruby. SDKs send screenshots and DOM snapshots to the Eyes cloud server for Visual AI comparison.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://applitools.com/docs/eyes
  baseURL: https://eyesapi.applitools.com
  tags:
  - SDK
  - Selenium
  - Cypress
  - Playwright
  - Appium
  - Visual AI
