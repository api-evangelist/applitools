apis:
- aid: applitools:eyes-server-api
  name: Applitools Eyes Server REST API
  description: >-
    REST API for the Applitools Eyes cloud server. Endpoint groups include Batch Management (results,
    statistics, properties, deletion), Discussions (list and manage comments), and SCM Integrations (status
    setting for source control systems). Authentication uses the user's Applitools API key.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://applitools.com/docs/eyes/reference/server-api
  baseURL: https://eyesapi.applitools.com
