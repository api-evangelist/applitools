openapi: 3.2.0
info:
  title: Applitools Eyes Autonomous API
  description: Applitools Eyes APIs are not public might be changed at any point in time.
  contact:
    name: Applitools
    url: https://applitools.com
    email: supprt@applitools.com
  version: v1
tags:
- name: Autonomous
paths:
  /api/Autonomous/e2e:
    post:
      tags:
      - Autonomous
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/ProvisionAutonomousE2E'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AutonomousE2EProvisionResult'
            application/json:
              schema:
                $ref: '#/components/schemas/AutonomousE2EProvisionResult'
            text/json:
              schema:
                $ref: '#/components/schemas/AutonomousE2EProvisionResult'
      summary: Create api autonomous e2e
      x-summary-source: derived
      operationId: postApiAutonomousE2e
      x-operation-id-source: derived
components:
  schemas:
    ProvisionAutonomousE2E:
      type: object
      additionalProperties: false
    AutonomousE2EProvisionResult:
      type: object
      properties:
        apiKey:
          type:
          - string
          - 'null'
        apiKeyReadOnly:
          type:
          - string
          - 'null'
        apiKeyOrgAdmin:
          type:
          - string
          - 'null'
        apiKeyOtherTeam:
          type:
          - string
          - 'null'
        notificationsApiKey:
          type:
          - string
          - 'null'
        apiKeyOtherOrg:
          type:
          - string
          - 'null'
      additionalProperties: false
