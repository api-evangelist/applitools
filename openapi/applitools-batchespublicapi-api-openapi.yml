openapi: 3.2.0
info:
  title: Applitools Eyes Batches Public API
  description: Applitools Eyes APIs are not public might be changed at any point in time.
  contact:
    name: Applitools
    url: https://applitools.com
    email: supprt@applitools.com
  version: v1
tags:
- name: BatchesPublicApi
paths:
  /api/v1/batches/{batchId}:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchResultsRequest'
      - name: batchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetBatchResultsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatchResultsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetBatchResultsResponse'
      summary: Get api batches by batch id
      x-summary-source: derived
      operationId: getApiV1BatchesByBatchId
      x-operation-id-source: derived
  /api/v1/batches/{BatchId}/{SessionId}/{StepIndex}/diff:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchSessionStepDiffRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      - name: SessionId
        in: path
        required: true
        schema:
          type: string
      - name: StepIndex
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TwoWayImageDiff'
            application/json:
              schema:
                $ref: '#/components/schemas/TwoWayImageDiff'
            text/json:
              schema:
                $ref: '#/components/schemas/TwoWayImageDiff'
      summary: Get api batches by batch id by session id by step index diff
      x-summary-source: derived
      operationId: getApiV1BatchesByBatchIdBySessionIdByStepIndexDiff
      x-operation-id-source: derived
  /api/v1/batches:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchStatsRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetBatchStatsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatchStatsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetBatchStatsResponse'
      summary: Get api batches
      x-summary-source: derived
      operationId: getApiV1Batches
      x-operation-id-source: derived
  /api/v1/batches/{BatchId}/pagecoverage:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchPageCoverageRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ByEnvironmentPageCoverageSummaryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ByEnvironmentPageCoverageSummaryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ByEnvironmentPageCoverageSummaryResponse'
      summary: Get api batches by batch id pagecoverage
      x-summary-source: derived
      operationId: getApiV1BatchesByBatchIdPagecoverage
      x-operation-id-source: derived
  /api/v1/batches/{BatchId}/pagecoveragebypageid:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchCoverageByPageIdRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetPageSummaryByPageIdResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetPageSummaryByPageIdResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetPageSummaryByPageIdResponse'
      summary: Get api batches by batch id pagecoveragebypageid
      x-summary-source: derived
      operationId: getApiV1BatchesByBatchIdPagecoveragebypageid
      x-operation-id-source: derived
  /api/v1/batches/{BatchId}/properties:
    get:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetBatchPropertiesRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetBatchPropertiesResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetBatchPropertiesResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetBatchPropertiesResponse'
      summary: Get api batches by batch id properties
      x-summary-source: derived
      operationId: getApiV1BatchesByBatchIdProperties
      x-operation-id-source: derived
    patch:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/PatchBatchPropertiesRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Update api batches by batch id properties
      x-summary-source: derived
      operationId: patchApiV1BatchesByBatchIdProperties
      x-operation-id-source: derived
  /api/v1/batches/{BatchId}:
    delete:
      tags:
      - BatchesPublicApi
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/DeleteBatchAndSessionsRequest'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete api batches by batch id
      x-summary-source: derived
      operationId: deleteApiV1BatchesByBatchId
      x-operation-id-source: derived
