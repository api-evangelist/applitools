openapi: 3.2.0
info:
  title: Applitools Eyes Accessibility Reports API
  description: Applitools Eyes APIs are not public might be changed at any point in time.
  contact:
    name: Applitools
    url: https://applitools.com
    email: supprt@applitools.com
  version: v1
tags:
- name: AccessibilityReports
paths:
  /api/accessibility-reports/batches/{BatchId}/{SessionId}/steps/{StepIndex}:
    get:
      tags:
      - AccessibilityReports
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetSessionAccessibilityReport'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      - name: SessionId
        in: path
        required: true
        schema:
          type: string
      - name: StepIndex
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AccessibilityReportResult'
            application/json:
              schema:
                $ref: '#/components/schemas/AccessibilityReportResult'
            text/json:
              schema:
                $ref: '#/components/schemas/AccessibilityReportResult'
      summary: Get api accessibility reports batches by batch id by session id steps by step…
      x-summary-source: derived
      operationId: getApiAccessibilityReportsBatchesByBatchIdBySessionIdStepsByStepIndex
      x-operation-id-source: derived
  /api/accessibility-reports/batches/{BatchId}/{SessionId}/issues:
    get:
      tags:
      - AccessibilityReports
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/GetSessionAccessibilityIssues'
      - name: BatchId
        in: path
        required: true
        schema:
          type: string
      - name: SessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/SessionAccessibilityIssues'
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAccessibilityIssues'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionAccessibilityIssues'
      summary: Get api accessibility reports batches by batch id by session id issues
      x-summary-source: derived
      operationId: getApiAccessibilityReportsBatchesByBatchIdBySessionIdIssues
      x-operation-id-source: derived
  /api/accessibility-reports/combined:
    post:
      tags:
      - AccessibilityReports
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/CombineAccessibilityReports'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CombinedAccessibilityReport'
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedAccessibilityReport'
            text/json:
              schema:
                $ref: '#/components/schemas/CombinedAccessibilityReport'
      summary: Create api accessibility reports combined
      x-summary-source: derived
      operationId: postApiAccessibilityReportsCombined
      x-operation-id-source: derived
  /api/accessibility-reports/combined/flat:
    post:
      tags:
      - AccessibilityReports
      parameters:
      - name: request
        in: query
        schema:
          $ref: '#/components/schemas/CombineAccessibilityReportsFlat'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FlatAccessibilityReport'
            application/json:
              schema:
                $ref: '#/components/schemas/FlatAccessibilityReport'
            text/json:
              schema:
                $ref: '#/components/schemas/FlatAccessibilityReport'
      summary: Create api accessibility reports combined flat
      x-summary-source: derived
      operationId: postApiAccessibilityReportsCombinedFlat
      x-operation-id-source: derived
