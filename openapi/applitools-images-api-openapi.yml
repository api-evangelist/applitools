      properties:
        left:
          type: integer
          format: int32
        top:
          type: integer
          format: int32
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        regionId:
          type:
          - string
          - 'null'
        paddingLeft:
          type:
          - integer
          - 'null'
          format: int32
        paddingTop:
          type:
          - integer
          - 'null'
          format: int32
        paddingRight:
          type:
          - integer
          - 'null'
          format: int32
        paddingBottom:
          type:
          - integer
          - 'null'
          format: int32
        domSelector:
          type:
          - string
          - 'null'
        diffDescriptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DiffDescription'
        right:
          type: integer
          format: int32
          readOnly: true
        bottom:
          type: integer
          format: int32
          readOnly: true
        location:
